  { id: 'direct', name: 'Direct', desc: 'Sell directly to owner-operators. Fastest in fragmented sectors.', mods: {} },
  { id: 'pe', name: 'PE-intermediated', desc: '1 GP = 5–15 portcos. Best pipeline multiplier. 725 deals in Spain 2024.',
    mods: { hospitality: { revenue:+2, goldilocks:+1 }, logistics: { speed:+2, revenue:+1, playbook:+1, goldilocks:+1, partner:+1 }, healthcare: { speed:+2, revenue:+1, playbook:+1, goldilocks:+1 }, retail: { speed:+1, revenue:+1, goldilocks:+1 }, manufacturing: { speed:+1, revenue:+1, goldilocks:+1 }, realestate: { speed:+1, revenue:+1, goldilocks:+1 } },
  },
  { id: 'partner', name: 'Partner / Avengers', desc: 'Assemble independent operators. US firms expanding EU, consortium sell.',
    mods: { hospitality: { partner:+1, speed:-1 }, logistics: { partner:+2, europe:+1, revenue:+1 }, healthcare: { partner:+2, europe:+1 }, retail: { partner:+1, europe:+1 }, manufacturing: { partner:+2, europe:+1, revenue:+1 }, realestate: { partner:+1 } },
  },
];

let selectedNiche = 'none';
let selectedChannel = 'direct';
let weights = {};
let expandedCards = {};
WEIGHTS.forEach(w => weights[w.id] = w.val);

function getModifiedScore(sector, dimId) {
  let val = sector.scores[dimId] || 0;
  const niche = NICHES.find(n => n.id === selectedNiche);
  if (niche && niche.mods[sector.id]) val += (niche.mods[sector.id][dimId] || 0);
  const chan = CHANNELS.find(c => c.id === selectedChannel);
  if (chan && chan.mods[sector.id]) val += (chan.mods[sector.id][dimId] || 0);
  return Math.max(1, Math.min(10, val));
}

function getWeightedScore(sector) {
  const totalW = Object.values(weights).reduce((a,b) => a+b, 0);
  if (totalW === 0) return 0;
  let score = 0;
  WEIGHTS.forEach(w => { score += getModifiedScore(sector, w.id) * (weights[w.id] / totalW); });
  return Math.round(score * 10) / 10;
}

function pillClass(v) { return v >= 8 ? 'pill-g' : v >= 6 ? 'pill-a' : 'pill-r'; }
function pillLabel(v) { return v >= 8 ? 'High' : v >= 6 ? 'Med' : 'Low'; }
function barColor(i) { return i === 0 ? '#1D9E75' : i === 1 ? '#378ADD' : '#a0a09a'; }

/* ── Render filter pills ── */
function renderFilters() {
  const np = document.getElementById('niche-pills');
  np.innerHTML = NICHES.map(n =>
    `<button class="filter-pill ${selectedNiche === n.id ? 'active' : ''}" data-niche="${n.id}">${n.name}</button>`
  ).join('');
  np.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => { selectedNiche = btn.dataset.niche; renderFilters(); renderAll(); });
  });

  const cp = document.getElementById('channel-pills');
  cp.innerHTML = CHANNELS.map(c =>
    `<button class="filter-pill ${selectedChannel === c.id ? 'active' : ''}" data-channel="${c.id}">${c.name}</button>`
  ).join('');
  cp.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => { selectedChannel = btn.dataset.channel; renderFilters(); renderAll(); });
  });

  // Brief
  const n = NICHES.find(x => x.id === selectedNiche);
  const c = CHANNELS.find(x => x.id === selectedChannel);
  const ranked = getRanked();
  const top = ranked[0];
  let briefHtml = '';
  if (n && n.id !== 'none') {
    briefHtml += `<div class="filter-brief"><strong>${n.name}</strong> — ${n.desc} Ceiling: ${n.ceiling}. Durability: ${n.durability}.</div>`;
  }
  briefHtml += `<div class="filter-brief" style="margin-top:0.35rem;"><strong>Result:</strong> ${n && n.id !== 'none' ? n.name : 'Baseline'} × ${c.name} → <strong>${top.name}</strong> ranks #1 (${getWeightedScore(top).toFixed(1)})</div>`;
  document.getElementById('filter-brief').innerHTML = briefHtml;
}

/* ── Advanced weights ── */
function renderWeights() {
  const totalW = Object.values(weights).reduce((a,b) => a+b, 0);
  document.getElementById('total-weight').textContent = totalW + '%';
  const el = document.getElementById('weight-controls');
  el.innerHTML = WEIGHTS.map(w => `
    <div class="weight-row">
      <span class="weight-label">${w.label}</span>
      <input type="range" min="0" max="40" step="1" value="${weights[w.id]}" data-id="${w.id}">
      <span class="weight-val" id="wv-${w.id}">${weights[w.id]}</span>
      <span class="weight-pct" id="wp-${w.id}">${totalW > 0 ? Math.round(weights[w.id]/totalW*100) : 0}%</span>
    </div>
  `).join('');
  el.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', e => {
      weights[e.target.dataset.id] = parseInt(e.target.value);
      renderAll();
    });
  });
}

function getRanked() {
  return [...SECTORS].sort((a,b) => getWeightedScore(b) - getWeightedScore(a));
}

/* ── Dashboard ── */
function renderDashboard() {
  const ranked = getRanked();
  const top = ranked[0];
  const maxScore = getWeightedScore(top) || 1;
  const bars = ranked.map((s, i) => {
    const score = getWeightedScore(s);
    const pct = Math.round(score / 10 * 100);
    return `<div class="dash-bar-row">
      <span class="dash-bar-label">${s.name}</span>
      <div class="dash-bar-wrap"><div class="dash-bar" style="width:${pct}%;background:${barColor(i)};"></div></div>
      <span class="dash-bar-score">${score.toFixed(1)}</span>
    </div>`;
  }).join('');

  document.getElementById('dashboard').innerHTML = `
    <div class="dash-winner">
      <span class="dash-rank">#1</span>
      <div>
        <div class="dash-name">${top.name}</div>
        <div class="dash-sub">${top.sub}</div>
      </div>
      <span class="dash-score">${getWeightedScore(top).toFixed(1)}</span>
    </div>
    <div class="dash-bars">${bars}</div>
  `;
}

/* ── Expandable ranking cards ── */
function renderRanking() {
  const ranked = getRanked();
  document.getElementById('ranking-cards').innerHTML = ranked.map((s, i) => {
    const score = getWeightedScore(s);
    const isOpen = expandedCards[s.id] || false;
    const pills = WEIGHTS.map(w => {
      const v = getModifiedScore(s, w.id);
      return `<span class="pill tip ${pillClass(v)}" data-tip="${w.label}">${v}</span>`;
    }).join('');

    // Matrix detail row
    const matrixRow = WEIGHTS.map(w => {
      const v = getModifiedScore(s, w.id);
      const pct = v * 10;
      return `<div class="matrix-item">
        <div class="matrix-score-bar"><div class="matrix-score-fill" style="width:${pct}%;background:${v >= 8 ? '#1D9E75' : v >= 6 ? '#d4a843' : '#c75c4b'};"></div></div>
        <span class="pill tip ${pillClass(v)}" data-tip="${w.label}" style="font-size:0.65rem;padding:0.1rem 0.35rem;">${v}</span>
        <div class="matrix-dim">${w.short}</div>
      </div>`;
    }).join('');

    // Goldilocks
    const gl = s.goldilocks;
    const goldilocksHtml = `
      <div class="detail-section-title">Goldilocks fit</div>
      <div class="detail-grid">
        <div class="mini-card"><div class="mini-label">Big firm ignores?</div><div class="mini-val">${gl.bigFirm}</div></div>
        <div class="mini-card"><div class="mini-label">Internal team can't?</div><div class="mini-val">${gl.internal}</div></div>
        <div class="mini-card"><div class="mini-label">Boutique growth</div><div class="mini-val">${gl.growth}</div></div>
      </div>`;

    // SaaS / Moat
    const ss = s.saas;
    const saasHtml = `
      <div class="detail-section-title">SaaS / Moat potential</div>
      <div class="detail-grid">
        <div class="mini-card"><div class="mini-label">Playbook</div><div class="mini-val">${ss.playbook}</div></div>
        <div class="mini-card"><div class="mini-label">SaaS product</div><div class="mini-val">${ss.saasProduct}</div></div>
        <div class="mini-card"><div class="mini-label">Data network effect</div><div class="mini-val">${ss.dataEffect}</div></div>
        <div class="mini-card"><div class="mini-label">Network / marketplace</div><div class="mini-val">${ss.networkEffect}</div></div>
      </div>`;

    // Geo
    const g = s.geo;
    const geoHtml = `
      <div class="detail-section-title">Geographic overlay</div>
      <div class="detail-grid">
        <div class="mini-card"><div class="mini-label">EU client density</div><div class="mini-val">${g.europe}</div></div>
        <div class="mini-card"><div class="mini-label">Spain market</div><div class="mini-val">${g.spain}</div></div>
        <div class="mini-card"><div class="mini-label">Spain advantage</div><div class="mini-val">${g.spainAdv}</div></div>
        <div class="mini-card"><div class="mini-label">Decision maker access</div><div class="mini-val">${g.access}</div></div>
      </div>`;

    // Insights + risks
    const insightsHtml = s.insights.map(x => `<div class="insight-box">${x}</div>`).join('');
    const risksHtml = s.risks.map(x => `<div class="risk-box">Risk: ${x}</div>`).join('');

    return `
      <div class="rank-card ${i===0?'winner':''}" data-sector="${s.id}">
        <div class="rank-header" onclick="toggleCard('${s.id}')">
          <span class="rank-badge">#${i+1}</span>
          <div style="flex:1;min-width:0;">
            <div class="sector-name">${s.name}</div>
            <div class="sector-sub">${s.sub}</div>
          </div>
          <div class="rank-pills">${pills}</div>
          <span class="score-num">${score.toFixed(1)}</span>
          <span class="expand-arrow ${isOpen?'open':''}">▶</span>
        </div>
        <div class="rank-body ${isOpen?'open':''}">
          <div class="rank-content">
            <div class="matrix-row">${matrixRow}</div>
            ${goldilocksHtml}
            ${saasHtml}
            ${geoHtml}
            <div class="detail-section-title">Key insights</div>
            ${insightsHtml}
            <div class="detail-section-title">Risks</div>
            ${risksHtml}
          </div>
        </div>
      </div>`;
  }).join('');
}

function toggleCard(sectorId) {
  expandedCards[sectorId] = !expandedCards[sectorId];
  renderRanking();
}

/* ── Adjacency ── */
const ADJACENCIES = [
  { to: 'realestate', toLabel: 'Real estate / PropTech', friction: 'low', frictionLabel: 'Low friction', timeline: 'Year 1–2', tier: 't1',
    bridge: 'Hotels are real estate. RevPAR → asset management. Same PE fund, same GP conversation.', mechanism: 'Lateral sell within existing GP relationship' },
  { to: 'healthcare', toLabel: 'Healthcare / clinics', friction: 'med', frictionLabel: 'Medium friction', timeline: 'Year 1–2', tier: 't2',
    bridge: 'Same PE playbook: buy fragmented independents at 6–8x, integrate ops, exit at 12–15x. Patient flow ≈ guest flow.', mechanism: 'GP with both hospitality and clinic portcos in same fund' },
  { to: 'logistics', toLabel: 'Logistics / 3PL', friction: 'med', frictionLabel: 'Medium friction', timeline: 'Year 2–3', tier: 't2',
    bridge: 'Labor-intensive, multi-location, margin-sensitive ops. Hospitality supply chain work is credible proof.', mechanism: 'GP referral to logistics portco + highest SaaS/moat ceiling' },
  { to: 'retail', toLabel: 'Retail / e-commerce', friction: 'med', frictionLabel: 'Medium friction', timeline: 'Year 2–3', tier: 't2',
    bridge: 'Omnichannel ops, inventory management, multi-location scheduling. Hospitality ops skills transfer cleanly.', mechanism: 'PE channel or direct — mid-market chains need the same operational lift' },
  { to: 'manufacturing', toLabel: 'Manufacturing / industrial', friction: 'high', frictionLabel: 'High friction', timeline: 'Year 3+', tier: 't3',
    bridge: 'Process variation by sub-industry limits playbook reuse. EU funds reduce buyer friction but sales cycles are longer.', mechanism: 'Requires manufacturing-specific credibility. Best entered via PE referral.' },
];

function renderAdjacency() {
  const ranked = getRanked();
  const top = ranked[0];
  const chanLabel = CHANNELS.find(c => c.id === selectedChannel)?.name || 'Direct';

  const beachhead = `
    <div class="adj-card" style="border:2px solid #1D9E75;">
      <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
        <span class="adj-node core">${top.name}</span>
        <span class="pill pill-b" style="font-size:0.68rem;">via ${chanLabel}</span>
        <span class="adj-timeline">Month 1 entry</span>
      </div>
      <div class="adj-detail" style="margin-top:0.4rem;">Current #1 sector. Beachhead for expansion.</div>
    </div>`;

  const paths = ADJACENCIES.map(a => `
    <div class="adj-card">
      <div class="adj-row">
        <span class="adj-node core" style="font-size:0.7rem;padding:0.25rem 0.45rem;">Beachhead</span>
        <span class="adj-arrow">→</span>
        <span class="adj-node ${a.tier}">${a.toLabel}</span>
        <span class="adj-friction ${a.friction}">${a.frictionLabel}</span>
        <span class="adj-timeline">${a.timeline}</span>
      </div>
      <div class="adj-detail" style="margin-top:0.35rem;"><strong style="color:#1a1a1a;">Bridge:</strong> ${a.bridge}</div>
      <div class="adj-detail"><strong style="color:#1a1a1a;">Mechanism:</strong> ${a.mechanism}</div>
    </div>
  `).join('');

  const principle = `
    <div class="insight-box" style="margin-top:0.5rem;">
      <strong>Munger principle:</strong> Each expansion should be <em>pulled</em> by an existing client relationship, not <em>pushed</em> by ambition. The GP who saw you transform their hotel chain asks you to look at their logistics asset — that's the natural motion.
    </div>`;

  document.getElementById('adjacency').innerHTML = beachhead + paths + principle;
}

/* ── Shortlist ── */
function renderShortlist() {
  const ranked = getRanked();
  const top3 = ranked.slice(0,3);

  const cards = top3.map((s, i) => `
    <div class="shortlist-card ${i===0?'winner':''}">
      <div style="display:flex;align-items:center;gap:0.65rem;margin-bottom:0.5rem;">
        <span class="rec-num">#${i+1}</span>
        <div>
          <div class="sector-name">${s.name}</div>
          <div class="sector-sub" style="font-size:0.75rem;">${s.sub} — score ${getWeightedScore(s).toFixed(1)}</div>
        </div>
      </div>
      ${s.insights.map(x => `<div class="insight-box">${x}</div>`).join('')}
      ${s.risks.map(r => `<div class="risk-box">Risk: ${r}</div>`).join('')}
      <div style="display:flex;gap:0.3rem;flex-wrap:wrap;margin-top:0.5rem;">
        <span class="pill pill-b">Spain ${pillLabel(getModifiedScore(s,'spain'))}</span>
        <span class="pill pill-b">EU ${pillLabel(getModifiedScore(s,'europe'))}</span>
        <span class="pill ${pillClass(getModifiedScore(s,'saas'))}">Moat ${pillLabel(getModifiedScore(s,'saas'))}</span>
        <span class="pill ${pillClass(getModifiedScore(s,'playbook'))}">Playbook ${pillLabel(getModifiedScore(s,'playbook'))}</span>
        <span class="pill ${pillClass(getModifiedScore(s,'speed'))}">Speed ${pillLabel(getModifiedScore(s,'speed'))}</span>
      </div>
    </div>
  `).join('');

  document.getElementById('shortlist').innerHTML = cards;
}

/* ── Render all ── */
function renderAll() {
  const totalW = Object.values(weights).reduce((a,b) => a+b, 0);
  document.getElementById('total-weight').textContent = totalW + '%';
  WEIGHTS.forEach(w => {
    const vEl = document.getElementById('wv-' + w.id);
    const pEl = document.getElementById('wp-' + w.id);
    if (vEl) vEl.textContent = weights[w.id];
    if (pEl) pEl.textContent = totalW > 0 ? Math.round(weights[w.id]/totalW*100) + '%' : '0%';
  });
  renderDashboard();
  renderRanking();
  renderAdjacency();
  renderShortlist();
  renderFilters();
}

/* ── Advanced toggle ── */
document.getElementById('adv-toggle-btn').addEventListener('click', () => {
  const panel = document.getElementById('adv-panel');
  const arrow = document.getElementById('adv-arrow');
  panel.classList.toggle('open');
  arrow.classList.toggle('open');
});

/* ── Init ── */
renderFilters();
renderWeights();
renderAll();
</script>
